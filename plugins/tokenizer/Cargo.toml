[package]
name = "tokenizer"
version = "0.0.0"
edition = "2021"
publish = false

# 宿主按 Cargo.toml 恢复依赖：包根必须有 Cargo.toml，产物落共享缓存
# `<root>/state/deps/cargo-target/release/tokenizer[.exe]`；`execute/launch.mjs` 据此定位二进制。
# 分词器经 `include_bytes!` 内嵌：构建期输入由宿主 `assets_manifest` 直拷提供。
[[bin]]
name = "tokenizer"
path = "execute/main.rs"

[dependencies]
plugin-sdk = { path = "../../plugin-sdk/rust" }
serde_json = "1"
# 纯 Rust 正则特性：避免 onig 的 C 依赖（本 tokenizer 的 Split 模式含负向前瞻，需 fancy-regex）。
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }
