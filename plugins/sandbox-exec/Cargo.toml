[package]
name = "sandbox-exec"
version = "0.0.0"
edition = "2021"
publish = false

# 宿主按 Cargo.toml 恢复依赖：包根必须有 Cargo.toml，产物落共享缓存
# `<root>/state/deps/cargo-target/release/sandbox-exec[.exe]`；`execute/launch.mjs` 据此定位二进制。
[[bin]]
name = "sandbox-exec"
path = "execute/main.rs"

[dependencies]
plugin-sdk = { path = "../../plugin-sdk/rust" }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp",
] }
