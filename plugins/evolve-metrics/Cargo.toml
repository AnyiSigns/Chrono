[package]
name = "evolve-metrics"
version = "0.0.0"
edition = "2021"
publish = false
# 集成测试住 `test/`（非 cargo 缺省 `tests/`），故关自动发现、显式声明 test target。
autotests = false

# 宿主按 Cargo.toml 恢复依赖：包根必须有 Cargo.toml，产物落共享缓存
# `<root>/state/deps/cargo-target/release/evolve-metrics[.exe]`；`execute/launch.mjs` 据此定位二进制。
[lib]
name = "evolve_metrics"
path = "src/lib.rs"

[[bin]]
name = "evolve-metrics"
path = "src/main.rs"

[[test]]
name = "integration"
path = "test/integration.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
